<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Cascading Horizontal Film Frames to represent Stop Motion / Animation -->
  <!-- Sharp, hard-edged geometry -->
  
  <!-- Frame 1 (Back) -->
  <g transform="translate(32, 44)">
    <rect x="0" y="0" width="128" height="104" fill="#09090b" stroke="#3f3f46" stroke-width="6" stroke-linejoin="miter"/>
    <!-- Top Sprockets -->
    <rect x="16" y="8" width="12" height="6" fill="#3f3f46"/>
    <rect x="44" y="8" width="12" height="6" fill="#3f3f46"/>
    <rect x="72" y="8" width="12" height="6" fill="#3f3f46"/>
    <rect x="100" y="8" width="12" height="6" fill="#3f3f46"/>
    <!-- Bottom Sprockets -->
    <rect x="16" y="90" width="12" height="6" fill="#3f3f46"/>
    <rect x="44" y="90" width="12" height="6" fill="#3f3f46"/>
    <rect x="72" y="90" width="12" height="6" fill="#3f3f46"/>
    <rect x="100" y="90" width="12" height="6" fill="#3f3f46"/>
    <!-- Inner Image Border -->
    <rect x="12" y="24" width="104" height="56" fill="none" stroke="#3f3f46" stroke-width="4" stroke-linejoin="miter"/>
  </g>

  <!-- Frame 2 (Middle) -->
  <g transform="translate(64, 76)">
    <rect x="0" y="0" width="128" height="104" fill="#09090b" stroke="#71717a" stroke-width="6" stroke-linejoin="miter"/>
    <!-- Top Sprockets -->
    <rect x="16" y="8" width="12" height="6" fill="#71717a"/>
    <rect x="44" y="8" width="12" height="6" fill="#71717a"/>
    <rect x="72" y="8" width="12" height="6" fill="#71717a"/>
    <rect x="100" y="8" width="12" height="6" fill="#71717a"/>
    <!-- Bottom Sprockets -->
    <rect x="16" y="90" width="12" height="6" fill="#71717a"/>
    <rect x="44" y="90" width="12" height="6" fill="#71717a"/>
    <rect x="72" y="90" width="12" height="6" fill="#71717a"/>
    <rect x="100" y="90" width="12" height="6" fill="#71717a"/>
    <!-- Inner Image Border -->
    <rect x="12" y="24" width="104" height="56" fill="none" stroke="#71717a" stroke-width="4" stroke-linejoin="miter"/>
  </g>

  <!-- Frame 3 (Front) -->
  <g transform="translate(96, 108)">
    <rect x="0" y="0" width="128" height="104" fill="#09090b" stroke="#e4e4e7" stroke-width="6" stroke-linejoin="miter"/>
    <!-- Top Sprockets -->
    <rect x="16" y="8" width="12" height="6" fill="#e4e4e7"/>
    <rect x="44" y="8" width="12" height="6" fill="#e4e4e7"/>
    <rect x="72" y="8" width="12" height="6" fill="#e4e4e7"/>
    <rect x="100" y="8" width="12" height="6" fill="#e4e4e7"/>
    <!-- Bottom Sprockets -->
    <rect x="16" y="90" width="12" height="6" fill="#e4e4e7"/>
    <rect x="44" y="90" width="12" height="6" fill="#e4e4e7"/>
    <rect x="72" y="90" width="12" height="6" fill="#e4e4e7"/>
    <rect x="100" y="90" width="12" height="6" fill="#e4e4e7"/>
    <!-- Inner Image Border -->
    <rect x="12" y="24" width="104" height="56" fill="none" stroke="#e4e4e7" stroke-width="4" stroke-linejoin="miter"/>
    
    <!-- Play Button -->
    <path d="M 57 40 L 78 52 L 57 64 Z" fill="#ffffff" stroke-linejoin="miter"/>
  </g>
</svg>
