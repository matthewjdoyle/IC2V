name: Tests

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]" imageio-ffmpeg
      - name: Test with isolated FFmpeg binary
        shell: python
        run: |
          import os
          import subprocess
          import sys
          import imageio_ffmpeg
          os.environ['IC2V_TEST_FFMPEG'] = imageio_ffmpeg.get_ffmpeg_exe()
          subprocess.run([sys.executable, '-m', 'pytest', '-q'], check=True)
